  <text x="1460.0" y="703.0" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Metrics</text>
  <text x="1460.0" y="741.0" fill="#9AAAC0" font-family="Arial, sans-serif" font-size="21" text-anchor="middle">atomics, STATS</text>
  <line x1="1060" y1="770" x2="1060" y2="830" stroke="#4B5B70" stroke-width="4" marker-end="url(#a)"/>
  <text x="1060" y="880" fill="#C4CBD3" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">disk: ordered replay · torn-tail repair · fail-closed corruption · crash-conscious compaction</text>
