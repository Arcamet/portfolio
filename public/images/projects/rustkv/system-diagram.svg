  <text x="1060.0" y="703.0" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Mutex&lt;AppendLog&gt;</text>
  <text x="1060.0" y="741.0" fill="#9AAAC0" font-family="Arial, sans-serif" font-size="21" text-anchor="middle">CRC32 records, sync_data</text>
