<svg width="1600" height="960" viewBox="0 0 1600 960" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RustKV system diagram">
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7C92"/></marker></defs>
  <rect width="1600" height="960" rx="32" fill="#071019"/>
  <rect x="44" y="44" width="10" height="92" rx="5" fill="#F0A36B"/>
  <text x="82" y="92" fill="white" font-family="Arial, sans-serif" font-size="44" font-weight="700">RustKV</text>
  <text x="82" y="130" fill="#7F92AB" font-family="Arial, sans-serif" font-size="24">Request path from TCP frame to durable append-only log</text>
  <rect x="80" y="210" width="400" height="120" rx="22" fill="#0D1622" stroke="#243041" stroke-width="2"/>
  <text x="280.0" y="268.0" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">rustkv-cli / client</text>
  <text x="280.0" y="306.0" fill="#9AAAC0" font-family="Arial, sans-serif" font-size="21" text-anchor="middle">length-prefixed TCP frames</text>
  <line x1="480" y1="270" x2="600" y2="270" stroke="#4B5B70" stroke-width="4" marker-end="url(#a)"/>
  <rect x="600" y="210" width="420" height="120" rx="22" fill="#0D1622" stroke="#F0A36B" stroke-width="3"/>
  <text x="810.0" y="268.0" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Connection thread</text>
  <text x="810.0" y="306.0" fill="#9AAAC0" font-family="Arial, sans-serif" font-size="21" text-anchor="middle">capped admission, 1 per client</text>
  <line x1="1020" y1="270" x2="1120" y2="270" stroke="#4B5B70" stroke-width="4" marker-end="url(#a)"/>
  <rect x="1120" y="210" width="400" height="120" rx="22" fill="#0D1622" stroke="#243041" stroke-width="2"/>
