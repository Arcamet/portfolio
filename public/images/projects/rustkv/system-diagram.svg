  <text x="1320.0" y="306.0" fill="#9AAAC0" font-family="Arial, sans-serif" font-size="21" text-anchor="middle">1 MiB versioned protocol</text>
  <line x1="1320" y1="330" x2="1320" y2="420" stroke="#4B5B70" stroke-width="4" marker-end="url(#a)"/>
  <rect x="560" y="420" width="1000" height="110" rx="22" fill="#0D1622" stroke="#F0A36B" stroke-width="3"/>
  <text x="1060.0" y="473.0" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Arc&lt;Database&gt;</text>
  <text x="1060.0" y="511.0" fill="#9AAAC0" font-family="Arial, sans-serif" font-size="21" text-anchor="middle">shared state, documented lock order</text>
  <line x1="700" y1="530" x2="420" y2="640" stroke="#4B5B70" stroke-width="4" marker-end="url(#a)"/>
  <line x1="1060" y1="530" x2="1060" y2="640" stroke="#4B5B70" stroke-width="4" marker-end="url(#a)"/>
  <line x1="1460" y1="530" x2="1460" y2="640" stroke="#4B5B70" stroke-width="4" marker-end="url(#a)"/>
  <rect x="160" y="640" width="520" height="130" rx="22" fill="#0D1622" stroke="#243041" stroke-width="2"/>
  <text x="420.0" y="703.0" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">RwLock&lt;Store&gt;</text>
  <text x="420.0" y="741.0" fill="#9AAAC0" font-family="Arial, sans-serif" font-size="21" text-anchor="middle">binary-safe keys/values, TTL</text>
